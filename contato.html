<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>PowerFit Studio - Contato</title>
</head>
<body>
  <header>
    <h1>Fale Conosco</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="sobre.html">Sobre</a></li>
        <li><a href="contato.html">Contato</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Envie uma Mensagem</h2>
      <form action="#" method="post">
        <div>
          <label for="nome">Nome:</label>
          <input type="text" id="nome" name="nome" required>
        </div>

        <div>
          <label for="email">E-mail:</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div>
          <label for="assunto">Assunto:</label>
          <input type="text" id="assunto" name="assunto" required>
        </div>

        <div>
          <label for="categoria">Categoria:</label>
          <select id="categoria" name="categoria">
            <option value="planos">Dúvidas sobre Planos</option>
            <option value="aulas">Aulas Experimentais</option>
            <option value="parcerias">Parcerias e Eventos</option>
            <option value="outros">Outros Assuntos</option>
          </select>
        </div>

        <div>
          <label for="comentario">Comentário:</label>
          <textarea id="comentario" name="comentario" rows="5" required></textarea>
        </div>

        <button type="submit">Enviar Mensagem</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 PowerFit Studio. Todos os direitos reservados.</p>
  </footer>
</body>
</html>
